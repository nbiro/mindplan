name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # The Publish workflow's repin job starts CI on its branch: a PR it opens with GITHUB_TOKEN
  # starts no pull_request run.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: mindplan check (graph + packages)
        run: node dist/index.js check

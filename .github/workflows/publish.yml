# Publish on merge to main (owned by Interaction i-npm-tag-publish).
# Every push to main checks whether package.json's version is on npm. When it is not, the
# publish job releases it with npm Trusted Publishing (OIDC, no NPM_TOKEN) and tags vX.Y.Z.
# A merge without a version bump publishes nothing. Bind the trusted publisher on npmjs.com to
# nbiro/mindplan + this file (publish.yml) + environment npm-publish. After a release, the repin
# job opens a PR that pins the self devDependency to it.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Queue pushes so two releases never run at once.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Is this version on npm?
        id: check
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if published=$(npm view "mindplan-mcp@$version" version 2>/dev/null) && [ "$published" = "$version" ]; then
            echo "mindplan-mcp@$version is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "mindplan-mcp@$version is not on npm; publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write # push the vX.Y.Z tag
      id-token: write # npm Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing needs npm 11.5.1 or later; setup-node ships an older npm.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - run: npm ci

      # Preflight (main only, clean tree) → npm test → tarball allowlist → publish → registry check.
      - name: Publish
        run: npm run publish:release -- --ci

      - name: Tag the release
        env:
          TAG: v${{ needs.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists on origin; leaving it."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

  # Repin the exact self devDependency to the release just published. A separate job, so a repin
  # failure never marks the release failed and re-running failed jobs retries only this. The PR
  # bumps no version, so merging it publishes nothing. Needs the repository setting that allows
  # GitHub Actions to create pull requests.
  repin:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the repin branch
      pull-requests: write # open the PR
      actions: write # dispatch CI (the pull_request run of a PR opened with GITHUB_TOKEN waits for approval)
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BRANCH: repin/mindplan-mcp-${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Open the repin PR
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "$BRANCH already exists on origin; leaving it."
            exit 0
          fi
          pinned=$(node -p "require('./package.json').devDependencies?.['mindplan-mcp'] ?? ''")
          if [ "$pinned" = "$VERSION" ]; then
            echo "mindplan-mcp is already pinned to $VERSION."
            exit 0
          fi
          git switch -c "$BRANCH"
          # npm's listing can lag behind the publish job's registry check.
          for attempt in 1 2 3 4 5; do
            if npm install --save-dev --save-exact --ignore-scripts --prefer-online --no-audit --no-fund "mindplan-mcp@$VERSION"; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "npm install mindplan-mcp@$VERSION kept failing."
              exit 1
            fi
            echo "npm install failed (attempt $attempt); retrying in 15s"
            sleep 15
          done
          unexpected=$(git status --porcelain | grep -v -E '^ M (package\.json|package-lock\.json)$' || true)
          if [ -n "$unexpected" ]; then
            echo "The repin changed more than package.json and package-lock.json:"
            echo "$unexpected"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repin mindplan-mcp to $VERSION" -- package.json package-lock.json
          git push origin "refs/heads/$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Repin mindplan-mcp to $VERSION" \
            --body "Pins the self devDependency to mindplan-mcp@$VERSION, released by run ${GITHUB_RUN_ID} and tagged v$VERSION. This PR bumps no package version, so merging it publishes nothing. CI was dispatched on this branch: see Actions → CI for $BRANCH. It does not show as checks here, and this PR's own pull_request run waits for a maintainer's approval."
          gh workflow run ci.yml --ref "$BRANCH"

# Publish on merge to main (owned by Interaction i-npm-tag-publish).
# Every push to main checks whether package.json's version is on npm. When it is not, the
# publish job releases it with npm Trusted Publishing (OIDC, no NPM_TOKEN) and tags vX.Y.Z.
# A merge without a version bump publishes nothing. Bind the trusted publisher on npmjs.com to
# nbiro/mindplan + this file (publish.yml) + environment npm-publish.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Queue pushes so two releases never run at once.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Is this version on npm?
        id: check
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if published=$(npm view "mindplan-mcp@$version" version 2>/dev/null) && [ "$published" = "$version" ]; then
            echo "mindplan-mcp@$version is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "mindplan-mcp@$version is not on npm; publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write # push the vX.Y.Z tag
      id-token: write # npm Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing needs npm 11.5.1 or later; setup-node ships an older npm.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - run: npm ci

      # Preflight (main only, clean tree) → npm test → tarball allowlist → publish → registry check.
      - name: Publish
        run: npm run publish:release -- --ci

      - name: Tag the release
        env:
          TAG: v${{ needs.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists on origin; leaving it."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

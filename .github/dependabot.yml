# Self-dependency repin (owned by Interaction i-npm-tag-publish).
# The repo pins its own package as an exact devDependency ("mindplan-mcp": "X.Y.Z"). After a
# release reaches npm, Dependabot opens a PR that repins it and refreshes package-lock.json.
# That PR bumps no package version, so merging it publishes nothing (the Publish workflow's
# version gate skips it). Only mindplan-mcp is allowed: no version-update PRs for anything else.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    allow:
      - dependency-name: mindplan-mcp
    # Keep the pin exact: 0.2.0 -> 0.2.1, never a range.
    versioning-strategy: increase
    open-pull-requests-limit: 1
